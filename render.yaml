# Render Blueprint : le site CandiPilot (gratuit). La base PostgreSQL est chez Neon (gratuite, sans expiration).
# Sur render.com : New > Blueprint > dépôt sodara-cpu/CandiPilot (branche main) ;
# Render demande alors DATABASE_URL : coller l'adresse de connexion Neon (postgresql://…?sslmode=require).
services:
  - type: web
    name: candipilot
    runtime: docker
    plan: free
    region: frankfurt          # proche de la base Neon (Europe)
    branch: main
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CANDIPILOT_ROBOT
        value: extension
      - key: CANDIPILOT_SECURE_COOKIE
        value: "1"
      - key: CANDIPILOT_TRUST_PROXY
        value: "1"
      # Page de l'extension sur le Chrome Web Store (une fois publiée) : bouton « Ajouter à Chrome ».
      - key: CANDIPILOT_EXTENSION_URL
        sync: false
      # Matching expliqué par Claude (lot 3). Sans clé : note des critères stricts seulement.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CANDIPILOT_LLM_DAILY_OFFERS
        value: "400"
      # Offres de France Travail (API officielle « Offres d'emploi v2 », francetravail.io).
      - key: FRANCE_TRAVAIL_CLIENT_ID
        sync: false
      - key: FRANCE_TRAVAIL_CLIENT_SECRET
        sync: false
      # E-mails « mot de passe oublié » : clé API Brevo (recommandé), sinon SMTP.
      - key: CANDIPILOT_BREVO_API_KEY
        sync: false
      - key: CANDIPILOT_SMTP_HOST
        value: smtp.gmail.com
      - key: CANDIPILOT_SMTP_PORT
        value: "587"
      - key: CANDIPILOT_SMTP_USER
        sync: false
      - key: CANDIPILOT_SMTP_PASSWORD
        sync: false
      - key: CANDIPILOT_SMTP_FROM
        sync: false
