# Render Blueprint : le site CandiPilot + sa base PostgreSQL.
# Sur render.com : New > Blueprint > choisir le dépôt sodara-cpu/CandiPilot (branche main).
services:
  - type: web
    name: candipilot
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: candipilot-db
          property: connectionString
      - key: CANDIPILOT_ROBOT
        value: extension
      - key: CANDIPILOT_SECURE_COOKIE
        value: "1"
      - key: CANDIPILOT_TRUST_PROXY
        value: "1"
      # E-mails « mot de passe oublié » : à remplir dans le tableau de bord Render.
      - key: CANDIPILOT_SMTP_HOST
        value: smtp.gmail.com
      - key: CANDIPILOT_SMTP_PORT
        value: "587"
      - key: CANDIPILOT_SMTP_USER
        sync: false
      - key: CANDIPILOT_SMTP_PASSWORD
        sync: false
      - key: CANDIPILOT_SMTP_FROM
        sync: false

databases:
  - name: candipilot-db
    plan: free
    databaseName: candipilot
